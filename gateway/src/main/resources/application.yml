# gateway: port 8080 = what angular calls. core instances behind it on 8082 (and 8083 / core-2 with the docker profile),
# payment-service on 8085, ai-service on 8086
# a new service gets its route here, above the catch-all /api/** route
server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  # JWT_SECRET (rate limit per user) from the shared secrets file, an env variable wins
  config:
    import: optional:file:./secrets.properties,optional:file:../springapp/secrets.properties,optional:file:./springapp/secrets.properties
  cloud:
    # no eureka: the core instances are listed here, the load balancer only uses the healthy ones
    discovery:
      client:
        simple:
          instances:
            core-service:
              - uri: ${CORE_1_URL:http://localhost:8082}
            payment-service:
              - uri: ${PAYMENT_URL:http://localhost:8085}
            ai-service:
              - uri: ${AI_URL:http://localhost:8086}
    loadbalancer:
      configurations: health-check
      health-check:
        interval: 5s
        path:
          default: /actuator/health
      # the list is fixed anyway, a cache would only hide a stopped instance for longer
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          # CORS lives here only (the core runs with CORS_ENABLED=false behind the gateway)
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${GRIDPULSE_CORS_ALLOWED_ORIGINS:*}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: '*'
                exposed-headers: Retry-After,Content-Disposition
                max-age: 3600
          # a core that still adds its own CORS headers must not double them
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          # first match wins
          routes:
            # never reachable from outside
            - id: internal
              uri: no://op
              predicates:
                - Path=/internal/**
              filters:
                - SetStatus=403
            # live boards (server-sent events): open for a long time, no response timeout
            - id: live
              uri: lb://core-service
              predicates:
                - Path=/api/live/**
              metadata:
                response-timeout: -1
            # the Copilot (logged-in chat with Confirm cards)
            - id: ai
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
            # the feedback ai: suggestions for drivers, the summary for admins
            - id: feedback-ai
              uri: lb://ai-service
              predicates:
                - Path=/api/feedback/suggestions,/api/feedback/summary
            # the faq chat lives in ai-service
            - id: chat
              uri: lb://ai-service
              predicates:
                - Path=/api/chat,/api/chat/**,/api/faqs
            # payments, refunds and the revenue summary live in payment-service
            - id: payments
              uri: lb://payment-service
              predicates:
                - Path=/api/payments,/api/payments/**
            - id: api
              uri: lb://core-service
              predicates:
                - Path=/api/**
              # a GET that hit a stopped instance is tried once more on the other one
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET

gridpulse:
  # true only behind a proxy we run ourselves: then X-Forwarded-For tells the visitor's address
  trust-proxy: ${GRIDPULSE_TRUST_PROXY:false}
  # the core's JWT_SECRET: a logged-in user gets their own buckets
  jwt-secret: ${JWT_SECRET:}
  # tried from the top, the first match counts. key IP = per address, CLIENT = per user (else per address)
  # capacity 0 = no limit. an empty bucket -> 429 + Retry-After
  rate-limit:
    rules:
      - { method: POST, paths: [/api/login, /api/admin/login], capacity: 5, period: 1m, key: IP }
      - { method: POST, paths: [/api/register/send-code, /api/password/forgot, /api/password/set-initial], capacity: 3, period: 10m, key: IP }
      - { method: POST, paths: [/api/register, /api/password/reset], capacity: 10, period: 10m, key: IP }
      # anonymous faq chat shares the gemini keys with the copilot: a small daily cap per address
      - { method: POST, paths: [/api/chat], capacity: 30, period: 1d, key: IP }
      - { method: POST, paths: ["/api/ai/copilot/**"], capacity: 20, period: 1m, key: CLIENT }
      - { method: POST, paths: [/api/payments/order], capacity: 10, period: 1m, key: CLIENT }
      - { paths: ["/api/live/**"], capacity: 0 }
      - { paths: ["/api/**"], capacity: 120, period: 1m, key: CLIENT }

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.gridpulse.gateway.GatewayApplication: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
