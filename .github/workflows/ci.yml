# every push / pull request: maven verify (unit + testcontainers tests) and the angular build, then the whole stack
# in docker (prebuilt jars, razorpay stub, emails to files) with an end-to-end smoke test and page screenshots
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch / pull request stops the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # every module, the testcontainers tests included (the runner has docker)
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload the service jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          # the leading wildcard keeps the module folders (core-service/target/core-service-0.0.1-SNAPSHOT.jar ...)
          path: '*/target/*-SNAPSHOT.jar'
          if-no-files-found: error
          retention-days: 3

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # production build, apiUrl http://localhost:8080 = the gateway of the e2e stack
      - name: Build
        run: npm run build

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/gridpulse-web
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download the service jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: .

      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Write .env with random secrets
        run: bash scripts/ci/write-env.sh

      # the images only copy the jars; --wait = every service healthy (or the step fails)
      - name: Start the stack
        run: |
          mkdir -p scripts/smoke/out/mails
          docker compose -f docker-compose.yml -f scripts/ci/compose.ci.yml --profile apps up -d --build --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test
        id: smoke
        run: node scripts/smoke/smoke.mjs

      # also after a failed smoke test (the pages show how far it got); never fails the job
      - name: Screenshots
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        continue-on-error: true
        working-directory: scripts/ci
        env:
          WEB_DIST: ${{ github.workspace }}/web-dist
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
          node screenshots.mjs

      - name: Dump the container logs
        if: failure()
        run: |
          mkdir -p scripts/smoke/out
          docker compose -f docker-compose.yml -f scripts/ci/compose.ci.yml --profile apps logs --no-color > scripts/smoke/out/compose.log 2>&1 || true

      # mails hold sign-up codes and session.json holds tokens: both stay on the runner
      - name: Upload the smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            scripts/smoke/out/**
            !scripts/smoke/out/mails/**
            !scripts/smoke/out/session.json
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f scripts/ci/compose.ci.yml --profile apps down -v

  # main only, after every test passed, and only once the repository variable DEPLOY_ENABLED is "true"
  # (docs/DEPLOYMENT.md): arm64 + amd64 images to ghcr.io, then the vm pulls them and restarts what changed
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download the service jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: .

      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the images only copy finished jars / files, so building for arm64 under emulation stays quick
      - name: Build and push the images
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for module in core-service notification-service payment-service ai-service gateway; do
            docker buildx build --platform linux/arm64,linux/amd64 -f docker/Dockerfile.java --build-arg MODULE=$module \
              -t ghcr.io/$owner/gridpulse-$module:latest -t ghcr.io/$owner/gridpulse-$module:$GITHUB_SHA --push .
          done
          docker buildx build --platform linux/arm64,linux/amd64 -f deploy/Dockerfile.web \
            -t ghcr.io/$owner/gridpulse-web:latest -t ghcr.io/$owner/gridpulse-web:$GITHUB_SHA --push .

      - name: Roll out on the vm
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh && echo "$VM_SSH_KEY" > ~/.ssh/vm && chmod 600 ~/.ssh/vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          ssh_vm() { ssh -i ~/.ssh/vm "$VM_USER@$VM_HOST" "$@"; }
          scp -i ~/.ssh/vm deploy/docker-compose.prod.yml deploy/backup.sh "$VM_USER@$VM_HOST:/opt/gridpulse/"
          scp -i ~/.ssh/vm docker/mysql/init.sql "$VM_USER@$VM_HOST:/opt/gridpulse/mysql-init.sql"
          echo "$GHCR_TOKEN" | ssh_vm "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
          ssh_vm "cd /opt/gridpulse && export TAG=$GITHUB_SHA && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"

      - name: Check the live site
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 40 --retry-delay 15 --retry-all-errors "https://$DOMAIN/api/faqs" -o /dev/null
          curl -fsS "https://$DOMAIN/" | grep -q '<app-root' && echo "live: https://$DOMAIN"
