# payment-service: razorpay orders, the confirm saga with the core, refunds. port 8085, its own database payment_db
spring.application.name=payment-service
server.port=${PAYMENT_PORT:8085}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# the one shared secrets file of every service (JWT_SECRET, INTERNAL_API_KEY, RAZORPAY_* ...), from the module folder or the root
spring.config.import=optional:file:./secrets.properties,optional:file:../secrets.properties

# database: payments + their audit trail, outbox and inbox
spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jackson.serialization.write-dates-as-timestamps=false

# the tokens are the core's: same JWT_SECRET; empty = the core's key file on this laptop (common-web JwtConfig)
jwt.secret=${JWT_SECRET:}
jwt.secret-file=${user.home}/.gridpulse/jwt-secret

# calls to the core's /internal/** carry this key in X-Internal-Key; empty = a fixed dev key + warning
gridpulse.internal-api-key=${INTERNAL_API_KEY:}

# the core instances (http://core-service), like the gateway: only the healthy ones get calls
spring.cloud.discovery.client.simple.instances.core-service[0].uri=${CORE_1_URL:http://localhost:8082}
spring.cloud.loadbalancer.configurations=health-check
spring.cloud.loadbalancer.health-check.interval=5s
spring.cloud.loadbalancer.health-check.path.default=/actuator/health
spring.cloud.loadbalancer.cache.enabled=false

# kafka: payment events go out through the outbox (common), the core's booking events come in
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000
logging.level.org.apache.kafka=ERROR

# payments (razorpay, TEST mode): rzp_test_... keys from secrets.properties, empty = payments answer 503
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
razorpay.timeout-seconds=20

# service/RefundJob: refunds, unpaid orders and unconfirmed bookings every 30 s; only one instance may run it
gridpulse.jobs.refund.enabled=true
# 2 threads: the outbox relay waiting for a kafka that is down must not hold up the refund job
spring.task.scheduling.pool.size=2

# circuit breakers: 5 failures in the last 10 calls -> no calls for 30 s (instant answer), then 2 trial calls
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.razorpay.base-config=default
resilience4j.circuitbreaker.instances.core.base-config=default
# a 4xx is the core's answer (car taken ...), not the core being down
resilience4j.circuitbreaker.instances.core.ignore-exceptions=com.gridpulse.payment.exceptions.CoreRefusedException
# only the "did anybody pay?" check is asked again, never an order or a refund (that could charge / refund twice)
resilience4j.retry.instances.razorpayCheck.max-attempts=3
resilience4j.retry.instances.razorpayCheck.wait-duration=500ms
# core: 2 more tries only where a second call is safe (reads, and the booking that is saved once per order)
resilience4j.retry.instances.core.max-attempts=3
resilience4j.retry.instances.core.wait-duration=300ms
resilience4j.retry.instances.core.retry-exceptions=com.gridpulse.payment.exceptions.CoreUnavailableException

# actuator: only the health check (docker, the gateway)
management.endpoints.web.exposure.include=health

# logging: warnings and errors, plus the start line
logging.level.root=WARN
logging.level.com.gridpulse=WARN
logging.level.com.gridpulse.payment.PaymentApplication=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
gridpulse.log-dir=${LOG_DIR:logs}
