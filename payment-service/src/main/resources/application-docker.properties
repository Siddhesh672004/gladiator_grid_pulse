# docker profile (compose "apps"): two core instances
# spring takes a list from one file only, so both entries are repeated here
spring.cloud.discovery.client.simple.instances.core-service[0].uri=${CORE_1_URL:http://localhost:8082}
spring.cloud.discovery.client.simple.instances.core-service[1].uri=${CORE_2_URL:http://localhost:8083}
