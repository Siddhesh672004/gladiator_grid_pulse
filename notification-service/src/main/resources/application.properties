# notification-service: kafka events in, emails out. port 8084, its own database notification_db (only the inbox)
spring.application.name=notification-service
server.port=${NOTIFICATION_PORT:8084}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# the one shared secrets file of every service (MAIL_USERNAME, MAIL_PASSWORD ...), from the module folder or the root
spring.config.import=optional:file:./secrets.properties,optional:file:../springapp/secrets.properties,optional:file:./springapp/secrets.properties

# database: which events were already emailed (processed_event)
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notification_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:examly}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# kafka: one consumer group, a new group starts at the oldest event still in the topic
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# the retry / dead letter topics are written by this service itself
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.operation-timeout=5s
# this service publishes nothing, so no outbox relay here
gridpulse.outbox.relay.enabled=false

# email (gmail smtp, username + app password from secrets.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# the startup log line "EMAIL: ..." tells whether gmail accepts the login
# MAIL_TO_FILE=true is for test runs only: no email is sent, the texts + files go to target/test-mails
gridpulse.mail.to-file=${MAIL_TO_FILE:false}
gridpulse.mail.file-dir=target/test-mails

# actuator: only the health check (docker, the gateway)
management.endpoints.web.exposure.include=health
# gmail is checked once at start (the EMAIL: log line), a health call must not wait for smtp
management.health.mail.enabled=false

# logging: warnings and errors, plus the start line, the gmail check and every email sent
logging.level.root=WARN
logging.level.com.gridpulse=WARN
logging.level.com.gridpulse.notification.NotificationApplication=INFO
logging.level.com.gridpulse.notification.config.EmailConfig=INFO
logging.level.com.gridpulse.notification.service=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
gridpulse.log-dir=${LOG_DIR:logs}
