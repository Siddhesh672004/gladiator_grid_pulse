# shared settings for every profile, the dev / prod files only hold what is different
spring.application.name=gridpulse
# 8082: the gateway (8080) is what the site calls, the core instances sit behind it
server.port=${SERVER_PORT:8082}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# secrets (super admin, api keys, gmail for notification-service) live in secrets.properties at the repo root, never pushed
# an environment variable with the same name wins over the file
# one shared file for every service: found from the module folder or from the repo root
spring.config.import=optional:file:./secrets.properties,optional:file:../secrets.properties

# behind the gateway CORS_ENABLED=false (the gateway answers CORS); alone (azure, one jar) the core does it itself
gridpulse.cors.enabled=${CORS_ENABLED:true}

# database (mysql, appdb), on azure DB_URL / DB_USERNAME / DB_PASSWORD come from the app settings
# no DB_URL -> DB_HOST / DB_PORT (docker compose: localhost:3306)
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/appdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# update keeps the data between restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# validation runs on the request dto (@Valid), not again when hibernate saves
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false

# json
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.format.date=iso
spring.mvc.format.time=iso
spring.mvc.format.date-time=iso

# jwt: set JWT_SECRET on a real server, empty = a key is made once and saved in jwt.secret-file
jwt.secret=${JWT_SECRET:}
jwt.secret-file=${user.home}/.gridpulse/jwt-secret
# 10 hours
jwt.expiration-ms=36000000

# super admin (values from secrets.properties)
gridpulse.super-admin.email=${SUPER_ADMIN_EMAIL:}
gridpulse.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# events (codes, invites, booking decisions) go to kafka through the outbox table (common: EventPublisher + OutboxRelay),
# notification-service turns them into emails. kafka down = the events wait in outbox_event, nothing is lost
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# kafka down: a send gives up after a few seconds (not the default minute), the relay tries again every 500 ms
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# config/KafkaTopicConfig makes the topics at start; kafka down at start = a warning, the app still starts
spring.kafka.admin.operation-timeout=5s
# live boards: every core instance reads gridpulse.race in its own group (messaging/LiveBoardListener)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# kafka down: its clients keep trying quietly, OutboxRelay writes one warning per outage
logging.level.org.apache.kafka=ERROR
# a topic another service made first still gets our settings (the 1 hour retention of the account topic)
spring.kafka.admin.modify-topic-configs=true
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000

# e-ticket codes (HMAC of the booking id): TICKET_SECRET from secrets.properties, empty = a fixed dev secret + warning
gridpulse.ticket-secret=${TICKET_SECRET:}

# service-to-service calls (/internal/**) need this key in X-Internal-Key; empty = a fixed dev key + warning
gridpulse.internal-api-key=${INTERNAL_API_KEY:}

# sign up / reset codes
gridpulse.otp.signup-minutes=10
gridpulse.otp.reset-minutes=10
gridpulse.otp.max-attempts=5
gridpulse.otp.resend-seconds=60
gridpulse.otp.invite-hours=48

# where the angular site runs: the admin invite email links to <frontend-url>/set-password
gridpulse.frontend-url=${FRONTEND_URL:http://localhost:8081}

# ai-service: the label of the admin's "Analyse" button (new feedback is labelled over kafka)
gridpulse.ai-url=${AI_URL:http://localhost:8086}

# pictures (cloudinary): keys from secrets.properties, empty = uploading answers 503
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=gridpulse
cloudinary.timeout-seconds=30
# max 5 MB per picture (same as ValidationRules.PICTURE_MAX_BYTES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# payment-service (razorpay, refunds): the dashboard revenue and the chat's orders, called with the caller's token
gridpulse.payment-url=${PAYMENT_URL:http://localhost:8085}

# actuator: /actuator/health is public (UP / DOWN), details and the other urls need an admin token
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=Admin,SuperAdmin

# cache in redis (config/CacheConfig): tracks 30 s, competitions 60 s. CACHE_TYPE=none = no cache, no redis needed
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# redis down must cost a request little time, the database answers instead
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# redis down = slower, not broken, so it does not turn /actuator/health DOWN
management.health.redis.enabled=false

# circuit breakers: 5 failures in the last 10 calls -> no calls for 30 s (instant answer), then 2 trial calls
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment.base-config=default
resilience4j.circuitbreaker.instances.cloudinary.base-config=default
# a bad picture is the user's mistake, not cloudinary being down
resilience4j.circuitbreaker.instances.cloudinary.ignore-exceptions=java.lang.IllegalArgumentException
resilience4j.circuitbreaker.instances.ai.base-config=default

# swagger ui on /swagger-ui.html, off in prod (application-prod.properties)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# logging: only warnings and errors are printed (console + the daily file)
logging.level.root=WARN
logging.level.com.gridpulse.core=WARN
# stays at INFO: the "Started ..." line
logging.level.com.gridpulse.core.CoreApplication=INFO
# hibernate warns about an old setting name that spring boot itself still uses
logging.level.org.hibernate.orm.deprecation=ERROR
# GlobalLoggingAspect logs every error once, spring's own copy would print rejected values
spring.mvc.log-resolved-exception=false
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# folder of the daily log files (logback-spring.xml)
gridpulse.log-dir=${LOG_DIR:logs}
