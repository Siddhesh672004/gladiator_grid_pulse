# prod profile = a real server, start it with SPRING_PROFILES_ACTIVE=prod
# platform/config/ProdSettingsCheck refuses to start when a must-have value below is missing

# only our own website may call the api, e.g. https://gridpulse.example.com
gridpulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# a real server needs its own fixed key
jwt.secret=${JWT_SECRET}

# e-ticket codes need their own secret (TICKET_SECRET), checked by platform/config/ProdSettingsCheck

# no api docs on a real server
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
