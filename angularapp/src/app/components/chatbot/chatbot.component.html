<section class="chat-window" *ngIf="isOpen" role="dialog" [attr.aria-label]="copilot ? 'GridPulse Copilot' : 'GridPulse Assistant'">
  <header class="chat-header">
    <span class="chat-avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="#fff" stroke-width="2" d="M4 15a8 8 0 0 1 16 0v2H4zM4 15h9l2-3"/></svg>
    </span>
    <div class="chat-titles">
      <strong>{{ copilot ? 'Copilot · ' + role : 'GridPulse Assistant' }}</strong>
      <small>Powered by Spring AI + Gemini</small>
    </div>
    <button type="button" class="chat-clear" (click)="clear()">Clear</button>
  </header>

  <div class="chat-messages" #messageList aria-live="polite">
    <div *ngFor="let bubble of bubbles" class="bubble-row" [class.mine]="bubble.from === 'user'">
      <div class="bubble" [class.user]="bubble.from === 'user'">{{ bubble.text }}</div>
      <small class="bubble-meta" *ngIf="bubble.from === 'bot' && metaLine(bubble)">{{ metaLine(bubble) }}</small>
      <div class="action-card" *ngFor="let view of bubble.cards" [class.closed]="view.state !== 'open' && view.state !== 'busy'">
        <p>{{ view.card.summary }}</p>
        <div class="action-row">
          <button type="button" class="action-confirm" (click)="confirm(view)" [disabled]="view.state !== 'open'">Confirm</button>
          <button type="button" class="action-cancel" (click)="cancel(view)" [disabled]="view.state !== 'open'">Cancel</button>
          <small class="action-state" [ngSwitch]="view.state">
            <span *ngSwitchCase="'open'">{{ timeLeft(view) }} left</span>
            <span *ngSwitchCase="'busy'">working...</span>
            <span *ngSwitchCase="'done'">confirmed</span>
            <span *ngSwitchCase="'cancelled'">cancelled</span>
            <span *ngSwitchCase="'expired'">no longer valid</span>
          </small>
        </div>
      </div>
    </div>
    <div class="bubble-row" *ngIf="isSending">
      <div class="bubble typing"><span></span><span></span><span></span></div>
    </div>
  </div>

  <form class="chat-input" (ngSubmit)="send()">
    <input #messageInput type="text" name="message" [(ngModel)]="message" [maxlength]="maxLength" autocomplete="off"
           [placeholder]="copilot ? 'Ask or tell the Copilot what to do...' : 'Ask a question...'" aria-label="Your question">
    <button type="submit" class="chat-send" [disabled]="!message.trim() || isSending" aria-label="Send">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </form>
  <!-- the box takes no more letters, so say why -->
  <p class="chat-limit" *ngIf="message.length >= maxLength">Message must be at most {{ maxLength }} characters</p>
</section>

<button type="button" class="chat-launcher" (click)="toggle()" [attr.aria-expanded]="isOpen"
        [attr.aria-label]="isOpen ? 'Close assistant' : 'Open assistant'">
  <svg *ngIf="!isOpen" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path d="M6 3v18" stroke="#fff" stroke-width="2"/>
    <path d="M7 4h11v8H7z" fill="#fff"/>
    <path d="M7 4h2.75v2.67H7zM12.5 4h2.75v2.67H12.5zM9.75 6.67h2.75v2.66H9.75zM15.25 6.67H18v2.66h-2.75zM7 9.33h2.75V12H7zM12.5 9.33h2.75V12H12.5z" fill="#222"/>
  </svg>
  <svg *ngIf="isOpen" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <span class="online-dot" *ngIf="!isOpen" aria-hidden="true"></span>
</button>
