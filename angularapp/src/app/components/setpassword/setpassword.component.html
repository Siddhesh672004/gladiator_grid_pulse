<app-authshell title="Welcome to the pit wall" text="The Super Admin made you a GridPulse admin." photo="cup"
               [points]="['The link works once', 'It expires after 48 hours', 'The Super Admin can send a new one']">

  <form class="auth-box" *ngIf="!done && linkComplete" [formGroup]="passwordForm" (ngSubmit)="save()" novalidate>
    <h2 class="display">Choose Your Password</h2>
    <p class="auth-info">Admin account: <strong>{{ email }}</strong></p>

    <app-field label="New password" type="password" inputId="newPassword" autocomplete="new-password" [maxlength]="64"
               [control]="passwordForm.get('newPassword')"></app-field>
    <app-field label="Confirm password" type="password" inputId="confirmPassword" autocomplete="new-password" [maxlength]="64"
               [control]="passwordForm.get('confirmPassword')"></app-field>

    <div class="server-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

    <button class="btn btn-main btn-big btn-block go" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Saving...' : 'Set Password' }}<app-icon name="arrow_forward"></app-icon>
    </button>
  </form>

  <div class="auth-box" *ngIf="!done && !linkComplete">
    <h2 class="display">Link Not Complete</h2>
    <p class="auth-info">Please open the link from your invite email again, or ask the Super Admin for a new invite.</p>
    <a class="btn btn-main btn-big btn-block" routerLink="/admin-login">Go to Admin Login</a>
  </div>

  <div class="auth-box" *ngIf="done">
    <h2 class="display">Password Set</h2>
    <p class="auth-info">{{ infoMessage }}</p>
    <a class="btn btn-main btn-big btn-block" routerLink="/admin-login">Go to Admin Login</a>
  </div>

</app-authshell>
