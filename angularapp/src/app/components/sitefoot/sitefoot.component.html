<footer class="foot">
  <div class="foot-top">
    <div class="about">
      <app-logo></app-logo>
      <p>Motorsport track booking and live race control.</p>
    </div>

    <nav aria-label="Pages">
      <span class="tag">Pages</span>
      <a routerLink="/">Start page</a>
      <a routerLink="/how-it-works">How it works</a>
      <a routerLink="/signup">Sign up</a>
      <a routerLink="/login">Driver login</a>
      <a routerLink="/admin-login">Admin login</a>
    </nav>

    <div>
      <span class="tag">Contact</span>
      <p>Phone: 123-456-7890</p>
      <p>Email: support&#64;gridpulse.com</p>
    </div>

    <div>
      <span class="tag">Photos</span>
      <a *ngFor="let credit of credits; trackBy: byIndex" [href]="credit.link" target="_blank" rel="noopener">
        {{ credit.photo }}: {{ credit.author }}, {{ credit.licence }}
      </a>
    </div>
  </div>

  <div class="foot-end">
    <span class="mono">Track booking · Live timing · Competitions</span>
    <button type="button" (click)="toTop()">Back to top<app-icon name="arrow_upward"></app-icon></button>
  </div>
</footer>
