# ai-service: the public faq chat, the logged-in Copilot, the feedback labels. port 8086, its own database ai_db
spring.application.name=ai-service
server.port=${AI_PORT:8086}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# the one shared secrets file of every service (GEMINI_API_KEY..., GROQ_API_KEY, JWT_SECRET ...), from the module folder or the root
spring.config.import=optional:file:./secrets.properties,optional:file:../springapp/secrets.properties,optional:file:./springapp/secrets.properties

# database: faqs + their vectors, the chat transcript, outbox and inbox
spring.datasource.url=${AI_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:examly}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jackson.serialization.write-dates-as-timestamps=false

# the tokens are the core's: same JWT_SECRET; empty = the core's key file on this laptop (config/JwtConfig)
jwt.secret=${JWT_SECRET:}
jwt.secret-file=${user.home}/.gridpulse/jwt-secret

# calls between the services' /internal/** carry this key in X-Internal-Key; empty = a fixed dev key + warning
gridpulse.internal-api-key=${INTERNAL_API_KEY:}

# kafka: events go out through the outbox (common), the core's events come in
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=ai-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000
logging.level.org.apache.kafka=ERROR
# 2 threads: the outbox relay waiting for a kafka that is down must not hold up the other jobs
spring.task.scheduling.pool.size=2

# ai chatbot: up to 3 gemini keys from secrets.properties, none = word-overlap search only
# a free key gets about 20 answers a day per model. key 1 used up -> key 2 -> key 3 -> key 1 (service/GeminiKeys)
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-key2=${GEMINI_API_KEY_2:}
gemini.api-key3=${GEMINI_API_KEY_3:}
gemini.embedding-model=gemini-embedding-2
# google retired gemini-2.5-flash (404 for new keys): the alias follows google's current flash model
gemini.generation-model=${GEMINI_GENERATION_MODEL:gemini-flash-latest}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# a Copilot answer with tools takes a few seconds; a key that hangs longer is left for the next one
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:25}
chatbot.similarity-threshold=0.65
chatbot.lexical-threshold=0.08
# spring ai's own setups are off: config/AiConfig makes one gemini client per key, GroqServiceImpl the groq one
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# feedback ai (groq through spring ai's openai client): GROQ_API_KEY from secrets.properties, empty = "Not analysed"
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b
groq.base-url=https://api.groq.com/openai
groq.timeout-seconds=10
# "thinking" models need "low" to stay fast, a normal model (llama ...) -> leave it empty
groq.reasoning-effort=low

# the core and payment-service instances (http://core-service, http://payment-service), like the gateway
spring.cloud.discovery.client.simple.instances.core-service[0].uri=${CORE_1_URL:http://localhost:8082}
spring.cloud.discovery.client.simple.instances.payment-service[0].uri=${PAYMENT_URL:http://localhost:8085}
spring.cloud.loadbalancer.configurations=health-check
spring.cloud.loadbalancer.health-check.interval=5s
spring.cloud.loadbalancer.health-check.path.default=/actuator/health
spring.cloud.loadbalancer.cache.enabled=false

# the Copilot's memory: the last 20 messages of each chat, in ai_db (spring ai's jdbc chat memory, our own
# schema script: its conversation id "<userId>:<chatId>" is longer than spring ai's mysql column)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema/copilot-chat-memory-mysql.sql

# cache in redis (config/CacheConfig): embeddings 24 h. CACHE_TYPE=none = no cache, no redis needed
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
management.health.redis.enabled=false

# circuit breakers: 5 failures in the last 10 calls -> no calls for 30 s (instant answer), then 2 trial calls
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.gemini.base-config=default
resilience4j.circuitbreaker.instances.groq.base-config=default
resilience4j.circuitbreaker.instances.core.base-config=default
resilience4j.circuitbreaker.instances.payment.base-config=default

# actuator: only the health check (docker, the gateway)
management.endpoints.web.exposure.include=health

# logging: warnings and errors, plus the start line and the gemini / faq start lines
logging.level.root=WARN
logging.level.com.gridpulse=WARN
logging.level.com.gridpulse.ai.AiApplication=INFO
logging.level.com.gridpulse.ai.service.GeminiServiceImpl=INFO
logging.level.com.gridpulse.ai.service.FaqServiceImpl=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
gridpulse.log-dir=${LOG_DIR:logs}
