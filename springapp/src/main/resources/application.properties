# shared settings for every profile, the dev / prod files only hold what is different
spring.application.name=gridpulse
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# secrets (gmail, super admin, api keys) live in springapp/secrets.properties, never pushed
# an environment variable with the same name wins over the file
spring.config.import=optional:file:./secrets.properties,optional:file:./springapp/secrets.properties

# database (mysql, appdb), on azure DB_URL / DB_USERNAME / DB_PASSWORD come from the app settings
# no DB_URL -> DB_HOST / DB_PORT (docker compose: localhost:3306)
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/appdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:examly}
# update keeps the data between restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# validation runs on the request dto (@Valid), not again when hibernate saves
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false

# json
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.format.date=iso
spring.mvc.format.time=iso
spring.mvc.format.date-time=iso

# jwt: set JWT_SECRET on a real server, empty = a key is made once and saved in jwt.secret-file
jwt.secret=${JWT_SECRET:}
jwt.secret-file=${user.home}/.gridpulse/jwt-secret
# 10 hours
jwt.expiration-ms=36000000

# super admin (values from secrets.properties)
gridpulse.super-admin.email=${SUPER_ADMIN_EMAIL:}
gridpulse.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# email (gmail smtp, username + app password from secrets.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# the startup log line "EMAIL: ..." tells whether gmail accepts the login
# MAIL_TO_FILE=true is for the automated test scripts only: no email is sent, the texts go to target/test-mails
gridpulse.mail.to-file=${MAIL_TO_FILE:false}
gridpulse.mail.file-dir=target/test-mails

# sign up / reset codes
gridpulse.otp.signup-minutes=10
gridpulse.otp.reset-minutes=10
gridpulse.otp.max-attempts=5
gridpulse.otp.resend-seconds=60
gridpulse.otp.invite-hours=48

# where the angular site runs: the admin invite email links to <frontend-url>/set-password
gridpulse.frontend-url=${FRONTEND_URL:http://localhost:8081}

# ai chatbot: up to 3 gemini keys from secrets.properties, none = word-overlap search only
# a free key gets about 20 answers a day per model. key 1 used up -> key 2 -> key 3 -> key 1 (service/GeminiKeys)
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-key2=${GEMINI_API_KEY_2:}
gemini.api-key3=${GEMINI_API_KEY_3:}
gemini.embedding-model=gemini-embedding-2
gemini.generation-model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# a normal answer takes about 1 s, a key that hangs longer is left for the next one
gemini.timeout-seconds=10
chatbot.similarity-threshold=0.65
chatbot.lexical-threshold=0.08
# spring ai's own gemini setup knows only one key -> off, config/AiConfig makes one client per key
spring.ai.model.chat=none

# feedback ai (groq): GROQ_API_KEY from secrets.properties, empty = feedback is saved as "Not analysed"
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b
groq.base-url=https://api.groq.com/openai/v1
groq.timeout-seconds=10
# "thinking" models need "low" to stay fast, a normal model (llama ...) -> leave it empty
groq.reasoning-effort=low

# pictures (cloudinary): keys from secrets.properties, empty = uploading answers 503
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=gridpulse
cloudinary.timeout-seconds=30
# max 5 MB per picture (same as ValidationRules.PICTURE_MAX_BYTES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# payments (razorpay, TEST mode): rzp_test_... keys from secrets.properties, empty = payments answer 503
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.base-url=https://api.razorpay.com/v1
razorpay.timeout-seconds=20

# service/RefundJob: refunds + unpaid order checks every 30 s, false on every instance but one
gridpulse.jobs.refund.enabled=true

# actuator: /actuator/health is public (UP / DOWN), details and the other urls need an admin token
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=Admin,SuperAdmin
# gmail is checked once at start (the EMAIL: log line), a health call must not wait for smtp
management.health.mail.enabled=false

# swagger ui on /swagger-ui.html, off in prod (application-prod.properties)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# logging: only warnings and errors are printed (console + the daily file)
logging.level.root=WARN
logging.level.com.examly.springapp=WARN
# these two stay at INFO: the "Started ..." line and "EMAIL: Gmail login OK"
logging.level.com.examly.springapp.SpringappApplication=INFO
logging.level.com.examly.springapp.config.EmailConfig=INFO
# hibernate warns about an old setting name that spring boot itself still uses
logging.level.org.hibernate.orm.deprecation=ERROR
# GlobalLoggingAspect logs every error once, spring's own copy would print rejected values
spring.mvc.log-resolved-exception=false
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# folder of the daily log files (logback-spring.xml)
gridpulse.log-dir=${LOG_DIR:logs}
