# prod profile = a real server, start it with SPRING_PROFILES_ACTIVE=prod
# config/ProdSettingsCheck refuses to start when a must-have value below is missing

# only our own website may call the api, e.g. https://gridpulse.example.com
gridpulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# a real server needs its own fixed key
jwt.secret=${JWT_SECRET}

# MAIL_USERNAME / MAIL_PASSWORD must be set and MAIL_TO_FILE must be off
