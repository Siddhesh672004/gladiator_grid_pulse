# local infra: mysql, redis, kafka (+ kafka ui with --profile ui). the apps run on the host (terminal mode) or here (profile "apps")
# start: copy .env.example to .env, then  docker compose up -d                        (infra only)
#                                        docker compose --profile ui up -d             (infra + kafka ui on 8090)
#        build the jars first:           ./mvnw -q package -DskipTests
#                                        docker compose --profile apps up -d --build  (infra + the services)
name: gridpulse

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # runs only on the first start with an empty volume
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # tcp ping: the temporary server of the first start has no network, so this waits for the real one
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # HOST = apps on this machine (localhost:9092), DOCKER = other containers (kafka:29092)
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # topics are made by the services that own them
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # the default 1 GB heap is far more than one dev broker needs
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    healthcheck:
      # the check tool gets a small heap of its own, else it would start with the broker's 384 MB
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  # only with --profile ui
  kafka-ui:
    profiles: [ui]
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gridpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # the services, only with --profile apps (a plain "docker compose up -d" stays infra only)
  # the images copy <module>/target/*.jar, so build the jars first (./mvnw -q package -DskipTests)
  # every service: 256 MB heap + serial gc unless APP_JAVA_OPTS (.env) says otherwise
  # JWT_SECRET (.env) is required: both core instances and the gateway must read the same tokens
  # two core instances from one image, the gateway shares the work between them
  core-1:
    profiles: [apps]
    image: gridpulse/core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: core-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      SERVER_PORT: 8082
      CORS_ENABLED: "false"
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      PAYMENT_URL: http://payment:8085
      AI_URL: http://ai:8086
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # starts after core-1 is healthy: both seed the super admin at start, on an empty db the second insert would fail
  core-2:
    profiles: [apps]
    image: gridpulse/core:local
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: core-service
    restart: unless-stopped
    ports:
      - "8083:8082"
    env_file: .env
    environment:
      SERVER_PORT: 8082
      CORS_ENABLED: "false"
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      PAYMENT_URL: http://payment:8085
      AI_URL: http://ai:8086
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-1:
        condition: service_healthy

  notification:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # razorpay orders, the confirm saga with the core, refunds (one instance: it runs the refund job)
  payment:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      CORE_1_URL: http://core-1:8082
      CORE_2_URL: http://core-2:8082
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # the faq chat, the Copilot and the feedback labels (gemini / groq keys from .env)
  ai:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: ai-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      CORE_1_URL: http://core-1:8082
      CORE_2_URL: http://core-2:8082
      PAYMENT_URL: http://payment:8085
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # the one address of the site: angular calls http://localhost:8080
  gateway:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        MODULE: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORE_1_URL: http://core-1:8082
      CORE_2_URL: http://core-2:8082
      PAYMENT_URL: http://payment:8085
      AI_URL: http://ai:8086
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    # core-2 joins the load balancer by itself once its health check answers
    depends_on:
      core-1:
        condition: service_healthy
      payment:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  mysql-data:
