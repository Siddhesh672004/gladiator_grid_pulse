<app-authshell title="Lost your password?" text="We email a reset code to your address." photo="cup"
               [points]="['The code works for 10 minutes', '5 wrong tries close the code', 'A new code closes the older one']">

  <!-- step 1: email -->
  <form class="auth-box" *ngIf="step === 'email'" [formGroup]="emailForm" (ngSubmit)="sendCode()" novalidate>
    <p class="auth-step"><app-startlights [lit]="1" [total]="3"></app-startlights>Step 1 of 3 · your email</p>
    <h2 class="display">Forgot Password</h2>
    <p class="auth-info">Enter your email, we send you a reset code.</p>

    <app-field label="Email" type="email" inputId="email" autocomplete="username" [maxlength]="100"
               [control]="emailForm.get('email')"></app-field>

    <div class="server-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

    <button class="btn btn-main btn-big btn-block go" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Sending...' : 'Send Code' }}<app-icon name="arrow_forward"></app-icon>
    </button>

    <div class="auth-links">
      <p class="auth-switch"><a [routerLink]="loginPage">Back to login</a></p>
    </div>
  </form>

  <!-- step 2: code + new password -->
  <form class="auth-box" *ngIf="step === 'reset'" [formGroup]="resetForm" (ngSubmit)="reset()" novalidate>
    <p class="auth-step"><app-startlights [lit]="2" [total]="3"></app-startlights>Step 2 of 3 · code and new password</p>
    <h2 class="display">New Password</h2>
    <p class="auth-info">{{ infoMessage }}</p>

    <app-field label="6-digit code" name="Code" type="tel" inputId="code" autocomplete="one-time-code" [digits]="true" [maxlength]="6"
               [control]="resetForm.get('code')"></app-field>
    <app-field label="New password" type="password" inputId="newPassword" autocomplete="new-password" [maxlength]="64"
               [control]="resetForm.get('newPassword')"></app-field>
    <app-field label="Confirm password" type="password" inputId="confirmPassword" autocomplete="new-password" [maxlength]="64"
               [control]="resetForm.get('confirmPassword')"></app-field>

    <div class="server-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

    <button class="btn btn-main btn-big btn-block go" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Saving...' : 'Change Password' }}<app-icon name="arrow_forward"></app-icon>
    </button>

    <div class="auth-links">
      <p class="auth-switch"><a [routerLink]="loginPage">Back to login</a></p>
    </div>
  </form>

  <div class="auth-box" *ngIf="step === 'done'">
    <p class="auth-step"><app-startlights [lit]="3" [total]="3"></app-startlights>Step 3 of 3 · done</p>
    <h2 class="display">Password Changed</h2>
    <p class="auth-info">{{ infoMessage }}</p>
    <a class="btn btn-main btn-big btn-block" [routerLink]="loginPage">Go to Login</a>
  </div>

</app-authshell>
