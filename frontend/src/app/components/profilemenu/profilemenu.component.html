<button type="button" class="profile-icon" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
        aria-label="Profile menu" [title]="username + ' / ' + role">
  <img *ngIf="picture" [src]="picture | cloudImage:96" alt="" width="38" height="38" (error)="picture = null">
  <ng-container *ngIf="!picture">{{ initial }}</ng-container>
</button>

<div class="profile-list" *ngIf="menuOpen">
  <span class="user-badge">{{ username }} / {{ role }}</span>
  <ng-container *ngIf="!askingLogout; else logoutQuestion">
    <button type="button" (click)="showProfile()"><app-icon name="person"></app-icon>Show User Profile</button>
    <button type="button" (click)="askLogout()"><app-icon name="logout"></app-icon>Log Out</button>
  </ng-container>

  <!-- logout confirmation, in the list itself -->
  <ng-template #logoutQuestion>
    <div class="logout-confirm" #logoutBox tabindex="-1" role="alertdialog" aria-labelledby="logoutText">
      <p id="logoutText">Are you sure you want to logout?</p>
      <div class="logout-actions">
        <button class="btn btn-small" type="button" (click)="logOut()">Yes, Logout</button>
        <button class="btn btn-grey btn-small" type="button" (click)="closeMenu()">Cancel</button>
      </div>
    </div>
  </ng-template>
</div>

<!-- a click anywhere else closes the list -->
<div class="menu-backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
